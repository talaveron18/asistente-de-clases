name: Construir instalador de Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**.py"
      - "requirements-installer.txt"
      - "installer.iss"
      - ".github/workflows/windows-installer.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-installer.txt

      - name: Validar sintaxis y pruebas
        shell: pwsh
        run: |
          python -m compileall -q .
          python -m unittest discover -s tests -p "test_*.py"

      - name: Construir aplicación
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir `
            --name AsistenteDeClases `
            --collect-all customtkinter `
            --collect-all faster_whisper `
            --collect-all ctranslate2 `
            --hidden-import pypdf `
            --hidden-import docx `
            main_v5.py

      - name: Instalar Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Crear Setup.exe
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'

      - name: Publicar instalador
        uses: actions/upload-artifact@v4
        with:
          name: Asistente-de-Clases-Setup
          path: installer_output/Asistente-de-Clases-Setup.exe
          if-no-files-found: error
          retention-days: 30
