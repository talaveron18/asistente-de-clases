name: Construir ARGOS para Windows

on:
  workflow_dispatch:
  push:
    branches: [main, refactor/single-installer]
    paths:
      - "**.py"
      - "tests/**"
      - "requirements-installer.txt"
      - "ARGOS.spec"
      - "installer.iss"
      - ".github/workflows/windows-installer.yml"

permissions:
  contents: write

concurrency:
  group: argos-windows-installer
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-installer.txt

      - name: Instalar dependencias
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-installer.txt
          pip install pytest

      - name: Validar código y pruebas
        shell: pwsh
        run: |
          python -m compileall -q .
          python -m pytest -q

      - name: Construir ARGOS con FFmpeg incluido
        shell: pwsh
        run: pyinstaller --noconfirm --clean ARGOS.spec

      - name: Verificar FFmpeg empaquetado
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\ARGOS\ffmpeg.exe")) {
            throw "El ejecutable empaquetado no contiene ffmpeg.exe"
          }
          & "dist\ARGOS\ffmpeg.exe" -version
          if ($LASTEXITCODE -ne 0) {
            throw "El ffmpeg.exe empaquetado no se puede ejecutar"
          }

      - name: Comprobar apertura y carga real del modelo
        shell: pwsh
        run: |
          $configDir = Join-Path $env:LOCALAPPDATA "AsistenteDeClases"
          New-Item -ItemType Directory -Force -Path $configDir | Out-Null
          @{
            hf_token = ""
            whisper_model = "tiny"
            idioma = "es"
            sample_rate = 16000
            min_hablantes = 2
            max_hablantes = 10
            usar_gpu = $false
            ultima_materia = ""
          } | ConvertTo-Json | Set-Content `
            -Path (Join-Path $configDir "config.json") -Encoding utf8
          $env:ARGOS_READY_FILE = Join-Path $env:RUNNER_TEMP "argos-ready-build.json"
          Remove-Item $env:ARGOS_READY_FILE -Force -ErrorAction SilentlyContinue
          $proceso = Start-Process "dist\ARGOS\ARGOS.exe" -PassThru
          $null = $proceso.WaitForInputIdle(15000)
          $limite = (Get-Date).AddMinutes(8)
          while (-not (Test-Path $env:ARGOS_READY_FILE) -and (Get-Date) -lt $limite) {
            Start-Sleep -Seconds 2
            $proceso.Refresh()
            if ($proceso.HasExited) {
              throw "ARGOS.exe se cerró antes de cargar Faster-Whisper"
            }
          }
          if (-not (Test-Path $env:ARGOS_READY_FILE)) {
            Stop-Process -Id $proceso.Id -Force -ErrorAction SilentlyContinue
            throw "Faster-Whisper no terminó de cargar en ocho minutos"
          }
          $resultado = Get-Content $env:ARGOS_READY_FILE -Raw | ConvertFrom-Json
          if (-not $resultado.modelos_cargados) {
            Stop-Process -Id $proceso.Id -Force -ErrorAction SilentlyContinue
            throw "La carga empaquetada de Faster-Whisper falló: $($resultado.detalle)"
          }
          $proceso.Refresh()
          if ($proceso.MainWindowTitle -notmatch "^ARGOS") {
            throw "ARGOS.exe no mostró su ventana principal"
          }
          Stop-Process -Id $proceso.Id -Force

      - name: Exigir transcripción e importación reales en el ejecutable
        shell: pwsh
        run: |
          $audio = Join-Path $env:RUNNER_TEMP "argos-voz-prueba.wav"
          Add-Type -AssemblyName System.Speech
          $voz = New-Object System.Speech.Synthesis.SpeechSynthesizer
          try {
            $voz.SetOutputToWaveFile($audio)
            $voz.Speak("Argos automatic transcription test with human speech")
          } finally {
            $voz.Dispose()
          }
          if (-not (Test-Path $audio)) {
            throw "Windows no pudo generar la muestra de voz de validación"
          }

          $video = Join-Path $env:RUNNER_TEMP "argos-video-prueba.mp4"
          & "dist\ARGOS\ffmpeg.exe" -y -hide_banner -loglevel error `
            -i $audio -c:a aac -vn $video
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $video)) {
            throw "No se pudo generar el vídeo de validación"
          }

          $documento = Join-Path $env:RUNNER_TEMP "argos-documento-prueba.txt"
          "Texto médico de prueba para validar la biblioteca de ARGOS." | `
            Set-Content -Path $documento -Encoding utf8
          $env:ARGOS_SELFTEST_AUDIO = $audio
          $env:ARGOS_SELFTEST_VIDEO = $video
          $env:ARGOS_SELFTEST_DOCUMENT = $documento
          $env:ARGOS_SELFTEST_RESULT = Join-Path `
            $env:RUNNER_TEMP "argos-runtime-selftest.json"
          Remove-Item $env:ARGOS_SELFTEST_RESULT -Force `
            -ErrorAction SilentlyContinue

          $prueba = Start-Process "dist\ARGOS\ARGOS.exe" `
            -PassThru -Wait
          if (-not (Test-Path $env:ARGOS_SELFTEST_RESULT)) {
            throw "ARGOS no escribió el resultado de la autoprueba"
          }
          $resultado = Get-Content $env:ARGOS_SELFTEST_RESULT `
            -Raw | ConvertFrom-Json
          if ($prueba.ExitCode -ne 0 -or -not $resultado.ok) {
            throw "Falló la inferencia empaquetada: $($resultado | ConvertTo-Json -Compress)"
          }
          if ($resultado.audio_segmentos -lt 1 `
              -or $resultado.video_segmentos -lt 1 `
              -or $resultado.documento_caracteres -lt 1) {
            throw "El ejecutable no procesó los tres archivos reales"
          }

      - name: Instalar Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Crear el único Setup.exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Probar instalación y desinstalación aisladas
        shell: pwsh
        run: |
          $destino = Join-Path $env:RUNNER_TEMP "ARGOS-Installed"
          $argumentos = @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART",
            "/DIR=$destino"
          )
          $instalacion = Start-Process "release\ARGOS-Setup.exe" `
            -ArgumentList $argumentos -PassThru -Wait
          if ($instalacion.ExitCode -ne 0) {
            throw "El instalador terminó con código $($instalacion.ExitCode)"
          }
          if (-not (Test-Path "$destino\ARGOS.exe")) {
            throw "La instalación no contiene ARGOS.exe"
          }
          & "$destino\ffmpeg.exe" -version
          if ($LASTEXITCODE -ne 0) {
            throw "FFmpeg no funciona después de instalar ARGOS"
          }
          $acceso = Join-Path $env:APPDATA `
            "Microsoft\Windows\Start Menu\Programs\ARGOS.lnk"
          if (-not (Test-Path $acceso)) {
            throw "No se creó el acceso directo del menú Inicio"
          }
          $env:ARGOS_READY_FILE = Join-Path $env:RUNNER_TEMP "argos-ready-installed.json"
          Remove-Item $env:ARGOS_READY_FILE -Force -ErrorAction SilentlyContinue
          $proceso = Start-Process "$destino\ARGOS.exe" -PassThru
          $null = $proceso.WaitForInputIdle(15000)
          $limite = (Get-Date).AddMinutes(4)
          while (-not (Test-Path $env:ARGOS_READY_FILE) -and (Get-Date) -lt $limite) {
            Start-Sleep -Seconds 2
            $proceso.Refresh()
            if ($proceso.HasExited) {
              throw "ARGOS instalado se cerró antes de cargar Faster-Whisper"
            }
          }
          if (-not (Test-Path $env:ARGOS_READY_FILE)) {
            Stop-Process -Id $proceso.Id -Force -ErrorAction SilentlyContinue
            throw "El ARGOS instalado no terminó de cargar Faster-Whisper"
          }
          $resultado = Get-Content $env:ARGOS_READY_FILE -Raw | ConvertFrom-Json
          if (-not $resultado.modelos_cargados) {
            Stop-Process -Id $proceso.Id -Force -ErrorAction SilentlyContinue
            throw "Faster-Whisper falló tras instalar: $($resultado.detalle)"
          }
          $proceso.Refresh()
          if ($proceso.MainWindowTitle -notmatch "^ARGOS") {
            throw "ARGOS instalado no mostró su ventana principal"
          }
          Stop-Process -Id $proceso.Id -Force
          $desinstalacion = Start-Process "$destino\unins000.exe" `
            -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" `
            -PassThru -Wait
          if ($desinstalacion.ExitCode -ne 0) {
            throw "El desinstalador terminó con código $($desinstalacion.ExitCode)"
          }
          if (Test-Path "$destino\ARGOS.exe") {
            throw "ARGOS.exe continúa presente después de desinstalar"
          }
          $tamano = (Get-Item "release\ARGOS-Setup.exe").Length
          "ARGOS-Setup.exe: $tamano bytes" | Out-File `
            -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Publicar artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ARGOS-Setup
          path: release/ARGOS-Setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publicar descarga directa latest
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view latest *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete latest --yes --cleanup-tag
          }
          gh release create latest "release/ARGOS-Setup.exe#ARGOS-Setup.exe" `
            --title "ARGOS — última versión" `
            --notes "Instalador único de ARGOS para Windows. Incluye la aplicación y FFmpeg; no requiere Python." `
            --latest
