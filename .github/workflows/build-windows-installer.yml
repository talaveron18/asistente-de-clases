name: Construir instalador de Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-installer.txt

      - name: Instalar dependencias
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-installer.txt
          pip install pyinstaller

      - name: Descargar FFmpeg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force vendor | Out-Null
          $zip = "$env:RUNNER_TEMP\ffmpeg.zip"
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP\ffmpeg" -Force
          $exe = Get-ChildItem "$env:RUNNER_TEMP\ffmpeg" -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $exe) { throw "No se encontró ffmpeg.exe" }
          Copy-Item $exe.FullName "vendor\ffmpeg.exe"

      - name: Construir aplicación
        shell: pwsh
        run: pyinstaller --noconfirm --clean AsistenteClases.spec

      - name: Construir instalador
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'

      - name: Publicar instalador
        uses: actions/upload-artifact@v4
        with:
          name: Asistente-de-Clases-Setup
          path: installer_output/Asistente-de-Clases-Setup.exe
          if-no-files-found: error
          retention-days: 30
