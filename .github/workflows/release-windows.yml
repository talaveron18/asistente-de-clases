name: Publicar instalador de Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-installer
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-installer.txt

      - name: Instalar dependencias
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-installer.txt

      - name: Construir aplicación
        shell: pwsh
        run: pyinstaller --noconfirm --clean windows_installer.spec

      - name: Instalar Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Construir Setup.exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\windows-installer.iss"

      - name: Subir artefacto de compilación
        uses: actions/upload-artifact@v4
        with:
          name: Asistente-de-Clases-Setup
          path: release/Asistente-de-Clases-Setup.exe
          if-no-files-found: error

      - name: Eliminar versión latest anterior
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release delete latest --yes --cleanup-tag

      - name: Publicar descarga directa
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create latest "release/Asistente-de-Clases-Setup.exe#Asistente-de-Clases-Setup.exe" --title "Asistente de Clases — última versión" --notes "Instalador completo para Windows. Descarga el archivo Setup.exe, ábrelo y sigue el asistente. No requiere Python, PowerShell ni FFmpeg instalados." --latest
